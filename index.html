<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AL SHAJAR AL AKHDAR OFFICE EQUIPMENTS.TR LLC SP</title>
  <!-- Credit: (hank!nd3 p4d4y41! -->

  <!-- External CSS Link -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-brand" id="navTitle">AL SHAJAR AL AKHDAR OFFICE EQUIPMENTS.TR LLC SP</div>
    <ul class="nav-links">
      <li><a href="#home" id="navHome">Home</a></li>
      <li><a href="#stationery" id="navStationery">Stationery</a></li>
      <li><a href="#services" id="navServices">Services</a></li>
      <li><a href="#about" id="navAbout">About</a></li>
      <li><a href="#contact" id="navContact">Contact</a></li>
    </ul>
  </nav>

  <!-- Language & Theme Controls -->
  <div class="sub-bar">
    <div>
      <label for="lang" id="lblLang">Language: </label>
      <select id="lang" onchange="changeLanguage()">
        <option value="en">English</option>
        <option value="ml">മലയാളം</option>
        <option value="ar">العربية</option>
      </select>
    </div>

    <div>
      <label for="theme" id="lblTheme">Theme: </label>
      <select id="theme" onchange="changeTheme()">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
        <option value="system">System</option>
      </select>
    </div>
  </div>

  <!-- Header Section with Logo & Search -->
  <header id="home">
    <img src="https://raw.githubusercontent.com/chankintepadayali/AL-SHAJAR-STATIONERY/ac3587723b488cc77d720d4fe1b1347035380a24/logo/alshajar%20logo%20bg.png" alt="Shop Logo" class="logo" id="siteLogo">

    <div class="search-container">
      <div class="search-box">
        <select class="category-select" id="categoryFilter">
          <option value="all" id="catAll">All Categories</option>
          <option value="notebooks" id="catNotebooks">Notebooks</option>
          <option value="pens" id="catPens">Pens & Writing</option>
          <option value="art" id="catArt">Art Supplies</option>
        </select>
        <input type="text" class="search-input" placeholder="Search products..." id="searchInput">
      </div>
    </div>
  </header>

  <!-- Image Slider Carousel (Loaded from config.json via script.js) -->
  <div class="carousel-wrapper">
    <div class="carousel-container" id="carouselContainer"></div>
    <button class="carousel-button prev" onclick="prevSlide()">&#10094;</button>
    <button class="carousel-button next" onclick="nextSlide()">&#10095;</button>
  </div>

  <!-- Products Section -->
  <section id="stationery">
    <h2 style="text-align: center;" id="secTitle">Our Categories</h2>
    <div class="products">
      <div class="product">
        <h3 id="prod1">Premium Notebook</h3>
        <p class="price" id="price1">
          <img src="https://raw.githubusercontent.com/pooyagolchian/dirham/main/dirham.svg" class="dirham-symbol" alt="AED"> 15
        </p>
        <button class="btnBuy">Buy Now</button>
      </div>
      <div class="product">
        <h3 id="prod2">Office Pens Set</h3>
        <p class="price" id="price2">
          <img src="https://raw.githubusercontent.com/pooyagolchian/dirham/main/dirham.svg" class="dirham-symbol" alt="AED"> 25
        </p>
        <button class="btnBuy">Buy Now</button>
      </div>
      <div class="product">
        <h3 id="prod3">Art Supplies</h3>
        <p class="price" id="price3">
          <img src="https://raw.githubusercontent.com/pooyagolchian/dirham/main/dirham.svg" class="dirham-symbol" alt="AED"> 10
        </p>
        <button class="btnBuy">Buy Now</button>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p id="footerTxt">&copy; 2026 Al Shajar Stationery, Sharjah. All rights reserved.</p>
  </footer>

  <!-- External JavaScript -->
  <script src="script.js"></script>

</body>
</html>
