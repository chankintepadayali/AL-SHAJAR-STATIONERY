<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Shajar Stationery</title>
<style>
:root {
  --bg-color: #f0f0f0;
  --text-color: #333;
  --header-bg: #fff;
  --card-bg: #fff;
  --price-color: #27ae60;
  --btn-bg: #3498db;
  --btn-text: #fff;
}

[data-theme="dark"] {
  --bg-color: #1a1a1a;
  --text-color: #f0f0f0;
  --header-bg: #2d2d2d;
  --card-bg: #2d2d2d;
  --price-color: #2ecc71;
  --btn-bg: #2980b9;
  --btn-text: #fff;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 0;
  background-color: var(--bg-color);
  color: var(--text-color);
  transition: background-color 0.3s, color 0.3s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Header & Nav Structure */
nav {
  background-color: var(--header-bg);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  animation: fadeIn 1s ease-in-out;
}

.nav-links {
  display: flex;
  gap: 20px;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav-links a {
  color: var(--text-color);
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s;
}

.nav-links a:hover {
  color: var(--price-color);
}

/* Top Options Bar (Language & Theme under Nav) */
.sub-bar {
  background-color: var(--header-bg);
  padding: 8px 20px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 15px;
  border-top: 1px solid rgba(0,0,0,0.05);
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  font-size: 0.9em;
}

select { 
  padding: 5px 10px; 
  border-radius: 5px; 
  border: 1px solid #ccc; 
  font-size: 0.9em; 
  background-color: var(--card-bg);
  color: var(--text-color);
}

/* Header Area (Logo & Center Search) */
header {
  background-color: var(--header-bg);
  padding: 30px;
  margin: 20px auto;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  max-width: 900px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  animation: fadeIn 1.2s ease-in-out;
}

/* Logo */
.logo { 
  width: 150px; 
  height: auto;
  border-radius: 8px;
}

/* Centralized Search Area */
.search-container {
  flex: 1;
  display: flex;
  justify-content: center;
  max-width: 600px;
  margin: 0 auto;
}

.search-box {
  display: flex;
  width: 100%;
  border: 2px solid var(--btn-bg);
  border-radius: 30px;
  overflow: hidden;
  background-color: var(--card-bg);
}

.category-select {
  border: none;
  background-color: transparent;
  padding: 10px 15px;
  font-size: 0.9em;
  border-right: 1px solid #ccc;
  outline: none;
  cursor: pointer;
}

.search-input {
  flex: 1;
  border: none;
  padding: 12px 18px;
  font-size: 1em;
  outline: none;
  background-color: transparent;
  color: var(--text-color);
}

/* Products Section */
.products { 
  display: flex; 
  justify-content: center; 
  gap: 30px; 
  flex-wrap: wrap; 
  margin-top: 30px; 
}

.product { 
  border: 1px solid #ddd; 
  padding: 25px; 
  width: 220px; 
  border-radius: 10px; 
  background-color: var(--card-bg);
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  transition: transform 0.3s ease, background-color 0.3s;
}

.product:hover { 
  transform: translateY(-5px);
  box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.price { 
  color: var(--price-color); 
  font-weight: bold; 
  font-size: 1.2em; 
  margin-bottom: 15px; 
}

button { 
  background-color: var(--btn-bg); 
  color: var(--btn-text); 
  border: none; 
  padding: 12px 25px; 
  border-radius: 5px; 
  cursor: pointer; 
  font-size: 1em; 
  transition: background-color 0.3s ease;
}

button:hover { 
  background-color: #2980b9; 
}

footer { 
  margin-top: 60px; 
  padding: 20px; 
  text-align: center; 
  background-color: var(--header-bg); 
}
</style>
</head>
<body>

<!-- Main Navigation -->
<nav>
  <div style="font-weight: bold; font-size: 1.2em;">AL-SHAJAR</div>
  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="#stationery">Stationery</a></li>
    <li><a href="#services">Services</a></li>
    <li><a href="#about">About</a></li>
    <li><a href="#contact">Contact</a></li>
  </ul>
</nav>

<!-- Sub Bar (Language & Theme on Right Side) -->
<div class="sub-bar">
  <div>
    <label for="lang">Language: </label>
    <select id="lang" onchange="changeLanguage()">
      <option value="en">English</option>
      <option value="ml">മലയാളം</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <div>
    <label for="theme">Theme: </label>
    <select id="theme" onchange="changeTheme()">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="system">System</option>
    </select>
  </div>
</div>

<!-- Main Header with Logo and Central Search -->
<header id="home">
  <!-- Left Side Logo -->
  <img src="https://raw.githubusercontent.com/chankintepadayali/AL-SHAJAR-STATIONERY/ac3587723b488cc77d720d4fe1b1347035380a24/logo/alshajar%20logo%20bg.png" alt="Shop Logo" class="logo" id="siteLogo">

  <!-- Center Search Bar with Categories -->
  <div class="search-container">
    <div class="search-box">
      <select class="category-select" id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="notebooks">Notebooks</option>
        <option value="pens">Pens & Writing</option>
        <option value="art">Art Supplies</option>
        <option value="office">Office Equipments</option>
      </select>
      <input type="text" class="search-input" placeholder="Search products..." id="searchInput">
    </div>
  </div>
</header>

<section id="stationery">
  <h2 style="text-align: center;">Our Categories</h2>
  <div class="products">
    <div class="product">
      <h3 id="prod1">Premium Notebook</h3>
      <p class="price">AED 15</p>
      <button>Buy Now</button>
    </div>
    <div class="product">
      <h3 id="prod2">Office Pens Set</h3>
      <p class="price">AED 25</p>
      <button>Buy Now</button>
    </div>
    <div class="product">
      <h3 id="prod3">Art Supplies</h3>
      <p class="price">AED 10</p>
      <button>Buy Now</button>
    </div>
  </div>
</section>

<footer>
  <p>&copy; 2026 Al Shajar Stationery, Sharjah. All rights reserved.</p>
</footer>

<script>
const lightLogo = "https://raw.githubusercontent.com/chankintepadayali/AL-SHAJAR-STATIONERY/ac3587723b488cc77d720d4fe1b1347035380a24/logo/alshajar%20logo%20bg.png";
const darkLogo  = "https://raw.githubusercontent.com/chankintepadayali/AL-SHAJAR-STATIONERY/6afd446b101d3380127b3f822b7ca0d5fd23daa3/logo/black%20logo%20bg.png";

function changeLanguage() {
  var lang = document.getElementById("lang").value;
  var prod1 = document.getElementById("prod1");
  var prod2 = document.getElementById("prod2");
  var prod3 = document.getElementById("prod3");

  if (lang === "ml") {
    prod1.innerHTML = "പ്രീമിയം നോട്ട്ബുക്ക്";
    prod2.innerHTML = "ഓഫീസ് പേനകൾ";
    prod3.innerHTML = "ആർട്ട് സപ്ലൈസ്";
  } else if (lang === "ar") {
    prod1.innerHTML = "دفتر ملاحظات فاخر";
    prod2.innerHTML = "مجموعة أقلام مكتبية";
    prod3.innerHTML = "مستلزمات فنية";
  } else {
    prod1.innerHTML = "Premium Notebook";
    prod2.innerHTML = "Office Pens Set";
    prod3.innerHTML = "Art Supplies";
  }
}

function updateLogoAndTheme(isDark) {
  var logoImg = document.getElementById("siteLogo");
  if (isDark) {
    document.documentElement.setAttribute('data-theme', 'dark');
    logoImg.src = darkLogo;
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    logoImg.src = lightLogo;
  }
}

function changeTheme() {
  var theme = document.getElementById("theme").value;
  if (theme === "system") {
    var isSystemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    updateLogoAndTheme(isSystemDark);
  } else if (theme === "dark") {
    updateLogoAndTheme(true);
  } else {
    updateLogoAndTheme(false);
  }
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
  if (document.getElementById("theme").value === "system") {
    updateLogoAndTheme(e.matches);
  }
});
</script>

</body>
</html>
