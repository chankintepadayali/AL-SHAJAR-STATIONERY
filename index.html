<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL SHAJAR AL AKHDAR OFFICE EQUIPMENTS.TR LLC SP</title>
    <!-- Credits: (hank!nd3 p4d4y41! -->
    
    <!-- External CSS link -->
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <nav class="navbar">
        <div class="nav-brand" id="navTitle" data-i18n="title">AL SHAJAR STATIONERY</div>
        <div class="nav-controls">
            <select id="langSelect" onchange="updateLanguage()">
                <option value="en">English</option>
                <option value="ml">മലയാളം</option>
                <option value="ar">العربية</option>
            </select>
            <select id="themeSelect" onchange="updateTheme()">
                <option value="system">System</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </div>
    </nav>

    <!-- Logo Section -->
    <header class="logo-header">
        <img src="" alt="Shop Logo" class="logo" id="siteLogo">
    </header>

    <!-- Main Banner Carousel -->
    <section class="carousel-wrapper">
        <div class="carousel-container" id="carouselContainer"></div>
        <button class="carousel-button prev" onclick="prevSlide()">&#10094;</button>
        <button class="carousel-button next" onclick="nextSlide()">&#10095;</button>
    </section>

    <!-- Categories Section -->
    <section class="categories-section">
        <h2 data-i18n="categories">Categories</h2>
        <div class="categories-grid" id="categoriesContainer">
            <!-- Categories dynamically loaded or static content -->
        </div>
    </section>

    <!-- Products / Services Section -->
    <section class="products-section">
        <h2 data-i18n="products">Our Products & Services</h2>
        <div class="products-grid" id="productsContainer">
            <!-- Products dynamically loaded from config or main JS -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 AL SHAJAR AL AKHDAR OFFICE EQUIPMENTS.TR LLC SP</p>
        </div>
    </footer>

    <!-- External Script link -->
    <script src="script/script.js"></script>
</body>
</html>
