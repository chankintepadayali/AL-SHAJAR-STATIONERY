<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL SHAJAR AL AKHDAR OFFICE EQUIPMENTS.TR LLC SP</title>
<style>
:root {
  --bg-color: #f0f0f0;
  --text-color: #333;
  --header-bg: #fff;
  --card-bg: #fff;
  --price-color: #27ae60;
  --btn-bg: #3498db;
  --btn-text: #fff;
}

[data-theme="dark"] {
  --bg-color: #1a1a1a;
  --text-color: #f0f0f0;
  --header-bg: #2d2d2d;
  --card-bg: #2d2d2d;
  --price-color: #2ecc71;
  --btn-bg: #2980b9;
  --btn-text: #fff;
}

* { box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 0;
  background-color: var(--bg-color);
  color: var(--text-color);
  transition: background-color 0.3s, color 0.3s;
}

/* Nav Bar */
nav {
  background-color: var(--header-bg);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  flex-wrap: wrap;
  gap: 10px;
}

.nav-brand { font-weight: bold; font-size: 1.2em; }

.nav-links {
  display: flex;
  gap: 15px;
  list-style: none;
  margin: 0;
  padding: 0;
  flex-wrap: wrap;
}

.nav-links a {
  color: var(--text-color);
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s;
}

.nav-links a:hover {
  color: #ff7e5f;
}

/* Sub-bar */
.sub-bar {
  background-color: var(--header-bg);
  padding: 10px 20px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 15px;
  border-top: 1px solid rgba(0,0,0,0.05);
  font-size: 0.9em;
  flex-wrap: wrap;
}

select { 
  padding: 5px 10px; 
  border-radius: 5px; 
  border: 1px solid #ccc; 
  font-size: 0.9em; 
  background-color: var(--card-bg);
  color: var(--text-color);
}

/* Back to School Hero Banner (GIF ഒഴിവാക്കിയത്) */
.hero-banner {
  background: linear-gradient(135deg, #ff7e5f, #feb47b);
  color: white;
  text-align: center;
  padding: 20px;
  margin: 15px auto;
  width: 95%;
  max-width: 900px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

.banner-text h1 {
  margin: 0 0 5px 0;
  font-size: 1.8em;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.banner-text p {
  margin: 0;
  font-size: 1em;
  font-weight: bold;
}

/* Header Area */
header {
  background-color: var(--header-bg);
  padding: 20px;
  margin: 10px auto;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  max-width: 900px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  width: 95%;
}

.logo { width: 140px; height: auto; border-radius: 8px; flex-shrink: 0; }
.search-container { flex: 1; width: 100%; }

.search-box {
  display: flex;
  width: 100%;
  border: 2px solid var(--btn-bg);
  border-radius: 30px;
  overflow: hidden;
  background-color: var(--card-bg);
}

.category-select {
  border: none;
  background-color: transparent;
  padding: 10px 12px;
  font-size: 0.85em;
  border-right: 1px solid #ccc;
  outline: none;
  cursor: pointer;
}

.search-input {
  flex: 1;
  border: none;
  padding: 10px 15px;
  font-size: 0.9em;
  outline: none;
  background-color: transparent;
  color: var(--text-color);
  min-width: 0;
}

/* Banner Carousel Styles */
.carousel-wrapper {
  max-width: 900px;
  width: 95%;
  margin: 20px auto;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.carousel-container {
  display: flex;
  transition: transform 0.5s ease-in-out;
}

.carousel-slide {
  min-width: 100%;
  position: relative;
}

.carousel-slide img {
  width: 100%;
  height: auto;
  display: block;
  object-fit: cover;
}

.carousel-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background-color: rgba(0,0,0,0.4);
  color: white;
  border: none;
  padding: 12px 16px;
  cursor: pointer;
  z-index: 10;
  border-radius: 50%;
  font-size: 1.2em;
  transition: background-color 0.3s;
}

.carousel-button:hover {
  background-color: rgba(0,0,0,0.8);
}

.prev { left: 15px; }
.next { right: 15px; }

/* Products Section */
.products { 
  display: flex; 
  justify-content: center; 
  gap: 20px; 
  flex-wrap: wrap; 
  margin-top: 20px; 
  padding: 0 15px;
}

.product { 
  border: 1px solid #ddd; 
  padding: 20px; 
  width: 220px; 
  border-radius: 10px; 
  background-color: var(--card-bg);
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  text-align: center;
  transition: transform 0.3s ease;
}

.product:hover {
  transform: translateY(-5px);
}

.price { 
  color: var(--price-color); 
  font-weight: bold; 
  font-size: 1.2em; 
  margin-bottom: 15px; 
}

button.btn-buy { 
  background-color: var(--btn-bg); 
  color: var(--btn-text); 
  border: none; 
  padding: 10px 20px; 
  border-radius: 5px; 
  cursor: pointer; 
  font-size: 1em; 
  width: 100%;
  transition: background-color 0.3s;
}

footer { 
  margin-top: 60px; 
  padding: 20px; 
  text-align: center; 
  background-color: var(--header-bg); 
}

@media screen and (max-width: 768px) {
  nav { flex-direction: column; text-align: center; }
  .nav-links { justify-content: center; font-size: 0.9em; }
  .sub-bar { justify-content: center; }
  header { flex-direction: column; text-align: center; }
  .logo { width: 120px; }
  .search-box { flex-direction: column; border-radius: 15px; }
  .category-select { border-right: none; border-bottom: 1px solid #ccc; padding: 8px; width: 100%; }
  .product { width: 100%; max-width: 320px; }
}
</style>
</head>
<body>

<!-- Navigation Bar -->
<nav>
  <div class="nav-brand">AL SHAJAR AL AKHDAR OFFICE EQUIPMENTS.TR LLC SP</div>
  <ul class="nav-links">
    <li><a href="#home">Home</a></li>
    <li><a href="#stationery">Stationery</a></li>
    <li><a href="#services">Services</a></li>

<!-- Language & Theme Sub-bar -->

  <div>
    <label>Language: </label>
    <select>
      <option value="en">English</option>
      <option value="ml">മലയാളം</option>
    </select>
  </div>
  <div>
    <label>Theme: </label>
    <select>
      <option value="light">Light</option>
      <option value="dark">Dark</option>

  </div>
</div>

<!-- Back to School Banner (GIF ഇല്ലാതെ) -->
<div class="hero-banner">
  <div class="banner-text">
    <h1>BACK TO SCHOOL</h1>
    <p>GET ALL STATIONERY ITEMS!</p>
  </div>
</div>

<!-- Search Header -->
<header id="home">
  <img src="https://raw.githubusercontent.com/chankintepadayali/AL-SHAJAR-STATIONERY/ac3587723b488cc77d720d4fe1b1347035380a24/logo/alshajar%20logo%20bg.png" alt="Shop Logo" class="logo">

    <div class="search-box">
      <select class="category-select">
        <option value="all">All Categories</option>

</header>

<!-- Auto-Swiping Banner Carousel (Search-ന് താഴെ) -->
<div class="carousel-wrapper">
  <div class="carousel-container" id="carouselContainer">
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/fayas-monu/AL-SHAJAR-STATIONERY/07a79661b014c77c77f5f16f3cb04a8d3b44f645/logo/office.jpeg" alt="Office Stationeries">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/fayas-monu/AL-SHAJAR-STATIONERY/07a79661b014c77c77f5f16f3cb04a8d3b44f645/logo/school.jpeg" alt="School Stationeries">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/fayas-monu/AL-SHAJAR-STATIONERY/07a79661b014c77c77f5f16f3cb04a8d3b44f645/logo/pastpapers.jpeg" alt="Past Papers Printing">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/fayas-monu/AL-SHAJAR-STATIONERY/07a79661b014c77c77f5f16f3cb04a8d3b44f645/logo/printing.jpeg" alt="Printing Services">
    </div>
    <div class="carousel-slide">
      <img src="https://raw.githubusercontent.com/fayas-monu/AL-SHAJAR-STATIONERY/07a79661b014c77c77f5f16f3cb04a8d3b44f645/logo/stamp.jpeg" alt="Stamps Making">

<footer>
  <p>&copy; 2026 Al Shajar Stationery, Sharjah. All rights reserved.</p>

<!-- Carousel Auto Swipe Script -->
<script>
let currentIndex = 0;
const container = document.getElementById('carouselContainer');
const slides = document.querySelectorAll('.carousel-slide');
const totalSlides = slides.length;

function updateSlidePosition() {
  container.style.transform = `translateX(-${currentIndex * 100}%)`;
}

function nextSlide() {
  if (currentIndex >= totalSlides - 1) {
    currentIndex = 0;
  } else {
    currentIndex++;
  }
  updateSlidePosition();
}

function prevSlide() {
  if (currentIndex <= 0) {
    currentIndex = totalSlides - 1;
  } else {
    currentIndex--;
  }
  updateSlidePosition();
}

setInterval(nextSlide, 3000);
</script>

</body>
