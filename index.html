<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AL SHAJAR AL AKHDAR OFFICE EQUIPMENTS.TR LLC SP</title>

<style>
:root {
  --bg-color: #f0f0f0;
  --text-color: #333;
  --header-bg: #fff;
  --card-bg: #fff;
  --price-color: #27ae60;
  --btn-bg: #3498db;
  --btn-text: #fff;
}

[data-theme="dark"] {
  --bg-color: #1a1a1a;
  --text-color: #f0f0f0;
  --header-bg: #2d2d2d;
  --card-bg: #2d2d2d;
  --price-color: #2ecc71;
  --btn-bg: #2980b9;
  --btn-text: #fff;
}

* { box-sizing: border-box; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 0;
  background-color: var(--bg-color);
  color: var(--text-color);
  transition: background-color 0.3s, color 0.3s;
}

/* Nav Bar */
nav {
  background-color: var(--header-bg);
  padding: 15px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  flex-wrap: wrap;
  gap: 10px;
}

.nav-brand { font-weight: bold; font-size: 1.2em; }

.nav-links {
  display: flex;
  gap: 15px;
  list-style: none;
  margin: 0;
  padding: 0;
  flex-wrap: wrap;
}

.nav-links a {
  color: var(--text-color);
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s;
}

.nav-links a:hover {
  color: #ff7e5f;
}

/* Sub-bar */
.sub-bar {
  background-color: var(--header-bg);
  padding: 10px 20px;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 15px;
  border-top: 1px solid rgba(0,0,0,0.05);
  font-size: 0.9em;
  flex-wrap: wrap;
}

select { 
  padding: 5px 10px; 
  border-radius: 5px; 
  border: 1px solid #ccc; 
  font-size: 0.9em; 
  background-color: var(--card-bg);
  color: var(--text-color);
}

/* Back to School Hero Banner */
.hero-banner {
  background: linear-gradient(135deg, #ff7e5f, #feb47b);
  color: white;
  text-align: center;
  padding: 25px 20px;
  margin: 15px auto;
  width: 95%;
  max-width: 900px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  display: flex;
  align-items: center;
  justify-content: space-around;
  flex-wrap: wrap;
  gap: 15px;
  overflow: hidden;
}

.banner-text {
  flex: 1;
  min-width: 250px;
}

.banner-text h1 {
  margin: 0 0 10px 0;
  font-size: 1.8em;
  text-transform: uppercase;
  letter-spacing: 1px;
  animation: textGlow 2s ease-in-out infinite alternate;
}

@keyframes textGlow {
  0% {
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.4);
    transform: scale(1);
  }
  100% {
    text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 20px #ff7e5f;
    transform: scale(1.02);
  }
}

.banner-gif {
  width: 140px;
  height: auto;
  border-radius: 10px;
  animation: floatKids 3s ease-in-out infinite alternate;
}

@keyframes floatKids {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-10px); }
}

/* Header Area */
header {
  background-color: var(--header-bg);
  padding: 20px;
  margin: 10px auto;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  max-width: 900px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  width: 95%;
}

.logo { width: 140px; height: auto; border-radius: 8px; flex-shrink: 0; }
.search-container { flex: 1; width: 100%; }

.search-box {
  display: flex;
  width: 100%;
  border: 2px solid var(--btn-bg);
  border-radius: 30px;
  overflow: hidden;
  background-color: var(--card-bg);
}

.category-select {
  border: none;
  background-color: transparent;
  padding: 10px 12px;
  font-size: 0.85em;
  border-right: 1px solid #ccc;
  outline: none;
  cursor: pointer;
}

.search-input {
  flex: 1;
  border: none;
  padding: 10px 15px;
  font-size: 0.9em;
  outline: none;
  background-color: transparent;
  color: var(--text-color);
  min-width: 0;
}

/* Products Section */
.products { 
  display: flex; 
  justify-content: center; 
  gap: 20px; 
  flex-wrap: wrap; 
  margin-top: 20px; 
  padding: 0 15px;
}

.product { 
  border: 1px solid #ddd; 
  padding: 20px; 
  width: 220px; 
  border-radius: 10px; 
  background-color: var(--card-bg);
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  text-align: center;
  transition: transform 0.3s ease;
}

.product:hover {
  transform: translateY(-5px);
}

.price { 
  color: var(--price-color); 
  font-weight: bold; 
  font-size: 1.2em; 
  margin-bottom: 15px; 
}

button { 
  background-color: var(--btn-bg); 
  color: var(--btn-text); 
  border: none; 
  padding: 10px 20px; 
  border-radius: 5px; 
  cursor: pointer; 
  font-size: 1em; 
  width: 100%;
  transition: background-color 0.3s;
}

button:hover {
  opacity: 0.9;
}

footer { 
  margin-top: 60px; 
  padding: 20px; 
  text-align: center; 
  background-color: var(--header-bg); 
}

/* Mobile Responsive */
@media screen and (max-width: 768px) {
  nav { flex-direction: column; text-align: center; }
  .nav-links { justify-content: center; font-size: 0.9em; }
  .sub-bar { justify-content: center; }
  header { flex-direction: column; text-align: center; }
  .logo { width: 120px; }
  .search-box { flex-direction: column; border-radius: 15px; }
  .category-select { border-right: none; border-bottom: 1px solid #ccc; padding: 8px; width: 100%; }
  .product { width: 100%; max-width: 320px; }
  .hero-banner { flex-direction: column; }
  .banner-gif { width: 110px; }
}
</style>
</head>
<body>

<!-- Navigation -->
<nav>
  <div class="nav-brand">AL SHAJAR AL AKHDAR OFFICE EQUIPMENTS.TR LLC SP </div>
  <ul class="nav-links">
    <li><a href="#home" id="navHome">Home</a></li>
    <li><a href="#stationery" id="navStationery">Stationery</a></li>
    <li><a href="#services" id="navServices">Services</a></li>
    <li><a href="#about" id="navAbout">About</a></li>
    <li><a href="#contact" id="navContact">Contact</a></li>
  </ul>
</nav>

<!-- Language & Theme Sub-bar -->
<div class="sub-bar">
  <div>
    <label for="lang" id="lblLang">Language: </label>
    <select id="lang" onchange="changeLanguage()">
      <option value="en">English</option>
      <option value="ml">മലയാളം</option>
      <option value="ar">العربية</option>
    </select>
  </div>

  <div>
    <label for="theme" id="lblTheme">Theme: </label>
    <select id="theme" onchange="changeTheme()">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="system">System</option>
    </select>
  </div>
</div>

<!-- Back to School Banner -->
<div class="hero-banner">
  <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ZqM2h6ZDF2MGs3a3YxdmY1dmcxaWNxeXhhbm0yaXRtdDF5MmR1biZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/26BGG7QOvhP4C4bE4/giphy.gif" alt="Back to School Kids" class="banner-gif">
  <div class="banner-text">
    <h1 id="bannerTitle">BACK TO SCHOOL</h1>
    <p id="bannerDesc">GET ALL STATIONERY ITEMS!</p>
  </div>
</div>

<!-- Header Area -->
<header id="home">
  <img src="https://raw.githubusercontent.com/chankintepadayali/AL-SHAJAR-STATIONERY/ac3587723b488cc77d720d4fe1b1347035380a24/logo/alshajar%20logo%20bg.png" alt="Shop Logo" class="logo" id="siteLogo">

  <div class="search-container">
    <div class="search-box">
      <select class="category-select" id="categoryFilter">
        <option value="all" id="catAll">All Categories</option>
        <option value="notebooks" id="catNotebooks">Notebooks</option>
        <option value="pens" id="catPens">Pens & Writing</option>
        <option value="art" id="catArt">Art Supplies</option>
      </select>
      <input type="text" class="search-input" placeholder="Search products..." id="searchInput">
    </div>
  </div>
</header>

<!-- Products Section -->
<section id="stationery">
  <h2 style="text-align: center;" id="secTitle">Our Categories</h2>
  <div class="products">
    <div class="product">
      <h3 id="prod1">Premium Notebook</h3>
      <p class="price" id="price1">AED 15</p>
      <button class="btnBuy">Buy Now</button>
    </div>
    <div class="product">
      <h3 id="prod2">Office Pens Set</h3>
      <p class="price" id="price2">AED 25</p>
      <button class="btnBuy">Buy Now</button>
    </div>
    <div class="product">
      <h3 id="prod3">Art Supplies</h3>
      <p class="price" id="price3">AED 10</p>
      <button class="btnBuy">Buy Now</button>
    </div>
  </div>
</section>

<footer>
  <p id="footerTxt">&copy; 2026 Al Shajar Stationery, Sharjah. All rights reserved.</p>
</footer>

<!-- External JavaScript File Reference -->
<script src="script.js"></script>

</body>
</html>
